# GitHub에 무언가 올라올 때마다 비밀값·개인정보 유출 검사를 자동으로 실행합니다.
# 검사에 걸리면 이 작업이 빨간 X(실패)로 표시되고, 저장소 주인에게 메일 알림이 갑니다.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 지난 커밋까지 모두 검사
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 비밀값·개인정보 검사
        run: python3 tests/secret_scan.py --history
